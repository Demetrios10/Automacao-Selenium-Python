[pytest]
# Configuração do Pytest
minversion = 7.0
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Caminho para os testes
testpaths = tests

# Opções de execução
addopts = 
    -v
    --strict-markers
    --tb=short
    --capture=no
    --color=yes

# Relatórios
junit_family = xunit2

# Marcadores customizados
markers =
    smoke: marca testes de smoke
    regression: marca testes de regressão
    critical: marca testes críticos
    login: marca testes de login
    cadastro: marca testes de cadastro
