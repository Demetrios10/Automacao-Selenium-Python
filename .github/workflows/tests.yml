name: Selenium e Python
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Executar os 11 cenários no site externo
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  unitarios:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: selenium-unitarios
          path: evidencias/execucoes/
  navegador:
    if: (github.event_name == 'workflow_dispatch' && inputs.run_e2e) || (github.event_name == 'pull_request' && github.head_ref == 'validation/selenium-e2e-20261118')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_register_e2e.py -v
        env:
          RUN_E2E: '1'
          HEADLESS: '1'
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: selenium-navegador
          path: evidencias/execucoes/
